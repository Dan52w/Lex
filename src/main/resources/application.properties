spring.application.name=LexCloud

# 1. CONEXIÓN A BASE DE DATOS (SUPABASE)
# Usamos el puerto 5432 y forzamos SSL para evitar el UnknownHostException
spring.datasource.url=jdbc:postgresql://db.xjjlfqkobikvezkpaqnl.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Pancaso5255
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. CONFIGURACIÓN DE HIBERNATE / JPA
# Usamos 'validate' porque ya tienes tablas creadas como 'tipo_clientes'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

