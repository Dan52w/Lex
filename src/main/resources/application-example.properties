# Plantilla P0-B8 — COPIAR a application.properties (o variables de entorno)
# y rellenar FUERA del repo. Ningún valor real debe commitearse.
# Spring Boot lee también variables de entorno: LEXCLOUD_JWT_SECRET, etc.
# (Spring relaja el nombre: lexcloud.jwt.secret <- LEXCLOUD_JWT_SECRET).
#
# --- Base de datos (PostgreSQL) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/lexcloud
# spring.datasource.username=lexcloud
# spring.datasource.password=<SOLO EN ENTORNO, NUNCA AQUÍ>
# spring.jpa.hibernate.ddl-auto=validate
# (P0: las tablas refresh_tokens y auditoria_seguridad deben existir antes
#  de arrancar si ddl-auto=validate; ver el DDL en README-P0.md. Si se usa
#  update en desarrollo, Hibernate las crea solas.)
#
# --- JWT / sesión (P0-B6) ---
# Secreto: mínimo 32 bytes, generado al azar (p. ej. 64 hex). ROTAR si hay
# duda de exposición (P0-B1). Sin este valor la app no debe arrancar.
# lexcloud.jwt.secret=<GENERAR, >=32 BYTES>
# Access corto en ms (15 min por defecto; 15-30 min según el plan).
# lexcloud.jwt.expiration=900000
# Refresh en días (14 por defecto).
# lexcloud.jwt.refresh-expiration-days=14
#
# --- Cookies (P0-B6/F1) ---
# Despliegue cross-site (front Vercel -> back Render): None + true.
# Desarrollo local (mismo http://localhost): Lax + false.
# lexcloud.cookie.samesite=None
# lexcloud.cookie.secure=true
#
# --- CORS / CSRF (P0-A2) ---
# Lista cerrada, sin trailing slash, sin "*". Actualizar si el front cambia
# de dominio (hoy: localhost:3000 y lex-cloud.vercel.app).
# lexcloud.cors.allowed-origins=http://localhost:3000,https://lex-cloud.vercel.app
#
# --- Documentos (P0-B5) ---
# Límite por documento en bytes (10 MB por defecto).
# lexcloud.documentos.max-bytes=10485760
# Supabase (SOLO servidor; la key nunca llega al front). Verificar: ¿bucket
# público o privado? ¿key anon o service_role? Si es service_role o el bucket
# es público, rotar la key y pasar a bucket privado (pendiente de Daniel).
# supabase.storage.url=https://<proyecto>.supabase.co/storage/v1/object/<bucket>/
# supabase.storage.key=<SOLO EN ENTORNO>
#
# --- Multipart (recomendado, coherente con el límite de 10 MB) ---
# spring.servlet.multipart.max-file-size=10MB
# spring.servlet.multipart.max-request-size=11MB
#
# --- Flyway (P1-B1) ---
# Las migraciones están en src/main/resources/db/migration (V1 baseline,
# V2 tablas P0, V3 alineación con entidades, V4 papelera e índices).
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true es OBLIGATORIO en bases EXISTENTES (db_Lex con
# datos): marca V1 como aplicada sin ejecutarla, y solo corren V2-V4.
# En una base NUEVA también es seguro: V1 se ejecuta completa.
# spring.flyway.baseline-on-migrate=true
# Con Flyway, ddl-auto debe ser validate (nunca update en despliegue):
# el esquema lo gobierna Flyway, no Hibernate.
# spring.jpa.hibernate.ddl-auto=validate
