spring.application.name=LexCloud

# URL corregida con el formato JDBC y los datos de Supabase
spring.datasource.url=jdbc:postgresql://db.${SUPABSE}.supabase.co:5432/postgres

# Credenciales de Supabase
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Ruta donde se guardarán los documentos legales
lexcloud.upload.dir=uploads/documentos

# Llave secreta 256 bits (Asegúrate de que la variable 'Llave' esté definida)
lexcloud.jwt.secret=${LLAVE}
# Tiempo de expiración
lexcloud.jwt.expiration=86400000

# IMPORTANTE: Cambia a 'none' o 'validate'
# Si las tablas ya existen en Supabase (porque subiste las migrations), usa 'validate'
spring.jpa.hibernate.ddl-auto=validate

# Ver qué consultas se hacen
spring.jpa.show-sql=true

# Dialecto de Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Credenciales S3 de Supabase
supabase.s3.endpoint=https://${SUPABSE}.supabase.co/storage/v1/s3
supabase.s3.access-key=TU_ACCESS_KEY
supabase.s3.secret-key=${SECRET_KEY}
supabase.s3.bucket-name=documentos